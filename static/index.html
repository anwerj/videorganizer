<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Local Video Organizer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- BOOTSTRAP CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Optional: Icon font -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <script>
        try {
            var _m = { slate: "azure", compact: "ember", default: "azure", minimal: "minimal" };
            var _t = localStorage.getItem("videorganizer.theme") || "azure";
            if (_m[_t]) _t = _m[_t];
            if (["azure", "violet", "jade", "ember", "minimal"].indexOf(_t) === -1) _t = "azure";
            document.documentElement.dataset.theme = _t;
        } catch (e) {
            document.documentElement.dataset.theme = "azure";
        }
    </script>
    <link rel="stylesheet" href="/static/css/themes.css">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div id="app" class="app-grid">
        <!-- Left tree (fixed width) -->
        <aside id="leftTree" class="panel tree-panel">
            <div id="treeScroll" class="tree-scroll"></div>
            <button id="btnSettings" type="button" class="settings-bar-btn" title="Settings (,)">
                <i class="bi bi-gear"></i> Settings
            </button>
        </aside>

        <!-- Main area: video takes all remaining space -->
        <main id="mainArea" class="panel main-panel d-flex flex-column">
            <!-- in index.html -->
            <div id="playerWrap" class="player-wrap w-100">
                <video id="mainVideo" crossorigin="anonymous"></video>

                <div id="previewCanvasWrap">
                    <canvas id="previewCanvas" width="320" height="180"></canvas>
                </div>



                <!-- Custom controls (overlay) -->
                <div id="controlsBar" class="controls-bar align-items-center">
                    <div id="seekOverlay" aria-hidden="true"></div>
                    <div id="progressWrapper" class="flex-grow-1"
                        style="height:10px; display:flex; align-items:center;">
                        <div id="progressBar"
                            style="height:6px; width:100%; background:rgba(255,255,255,0.08); border-radius:3px; cursor:pointer; position:relative;">
                            <div id="progressFill"
                                style="height:100%; width:0%; background:var(--accent); border-radius:3px;">
                            </div>
                        </div>
                    </div>
                    <div class="controls-buttons d-flex">
                        <button id="btnPlay" class="btn btn-sm btn-light me-2" title="Play/Pause">►</button>
                        <button id="btnPrev" class="btn btn-sm btn-light me-2" title="Prev">⟲</button>
                        <button id="btnNext" class="btn btn-sm btn-light me-2" title="Next">⟳</button>

                        <div id="timeDisplay" class="mono small-muted me-3">0:00 / 0:00</div>
                        <input id="vol" type="range" min="0" max="1" step="0.01" value="1" style="width:110px"
                            title="Volume" />
                        <button id="btnFull" class="btn btn-sm btn-light ms-2" title="Fullscreen">[ ]</button>
                        <button id="btnRotate" class="btn btn-sm btn-light ms-2" title="Rotate">⤾</button>
                        <button id="btnGoogleSearch" class="btn btn-sm btn-light ms-2"
                            title="Copy frame to clipboard and open Google Images" disabled><i class="bi bi-google"></i></button>
                        <button id="btnTimestamps" class="btn btn-sm btn-light ms-2" title="View Timestamps"
                            style="display:none">🖻</button>
                    </div>
                </div>
            </div>


            <div id="fileLabel" class="mt-2 small-muted mono"></div>
        </main>
    </div>

    <!-- Edit / Rename Modal -->
    <div class="modal fade" id="renameModal" tabindex="-1" aria-labelledby="renameModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl modal-dialog-scrollable">
            <div class="modal-content edit-modal">
                <div class="modal-header border-0 pb-0">
                    <div>
                        <h5 class="modal-title" id="renameModalLabel">Edit file</h5>
                        <div class="small-muted mt-1">Sections, properties, title — then confirm rename</div>
                    </div>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body pt-3">
                    <div class="edit-path mb-3">
                        <label class="form-label edit-label">Current path</label>
                        <div id="curPath" class="edit-path-value mono"></div>
                    </div>

                    <div class="edit-body-grid">
                        <aside class="edit-sections-col">
                            <section class="edit-block sections-block h-100">
                                <label class="edit-label section-title mb-2" title="Click to add in order; top = filename order">
                                    Sections
                                    <span class="edit-hint section-title-hint"> · click to add</span>
                                </label>
                                <div id="sectionList" class="section-list" aria-label="Sections"></div>
                            </section>
                        </aside>

                        <div class="edit-main-col">
                            <section class="edit-block mb-3">
                                <div class="d-flex align-items-baseline justify-content-between mb-2">
                                    <label class="edit-label mb-0">Properties</label>
                                    <span class="edit-hint">Toggle any; saved alphabetically</span>
                                </div>
                                <div id="propertyPalette" class="tag-palette property-palette" aria-label="Properties"></div>
                            </section>

                            <section class="edit-block mb-3">
                                <label class="form-label edit-label" for="editTitle">Title</label>
                                <div class="title-input-wrap">
                                    <input id="editTitle" type="text" class="form-control edit-input" placeholder="Human-readable name" autocomplete="off" />
                                </div>
                            </section>

                            <section class="edit-block mb-2">
                                <label class="form-label edit-label">Filename preview</label>
                                <div id="filenamePreview" class="filename-preview mono">—</div>
                                <input id="newName" type="hidden" />
                            </section>
                        </div>
                    </div>

                    <div id="msg" class="edit-msg mono mt-2"></div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="btnConfirmRename" class="btn btn-primary btn-sm px-4">Rename</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
            <div class="modal-content edit-modal settings-modal">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title" id="settingsModalLabel">Settings</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body pt-3">
                    <section class="edit-block mb-3">
                        <label class="edit-label mb-2">Appearance</label>
                        <div id="settingsThemes" class="theme-picker-options"></div>
                    </section>

                    <section class="edit-block mb-3">
                        <label class="edit-label mb-2">Sections</label>
                        <div id="settingsSectionList" class="section-list settings-section-list" aria-label="Sections"></div>
                    </section>

                    <section class="edit-block mb-3">
                        <label class="edit-label mb-2">Properties</label>
                        <div id="settingsPropertyPalette" class="tag-palette property-palette settings-property-palette" aria-label="Properties"></div>
                    </section>

                    <section class="edit-block mb-2">
                        <label class="edit-label mb-2">Keywords</label>
                        <div id="settingsKeywordList" class="keyword-list mb-2" aria-label="Keywords"></div>
                        <div class="keyword-add-row">
                            <input id="settingsKeywordAdd" type="text" class="form-control form-control-sm edit-input" placeholder="New keyword" />
                            <button id="settingsKeywordAddBtn" type="button" class="btn btn-outline-light btn-sm">Add</button>
                        </div>
                    </section>

                    <div id="settingsMsg" class="edit-msg mono mt-2"></div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-light btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- File List Modal (Fullscreen) -->
    <div class="modal fade" id="fileListModal" tabindex="-1" aria-labelledby="fileListModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content bg-dark text-white">
                <div class="modal-header">
                    <h5 class="modal-title" id="fileListModalLabel">File List</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Close"></button>
                </div>
                <div class="modal-body p-0">
                    <div id="fullFileList" class="p-3"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOOTSTRAP JS (CDN) - must come before app.js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Your app JS -->
    <script type="module" src="/static/js/controls.js"></script>
    <script type="module" src="/static/js/modals.js"></script>
    <script type="module" src="/static/js/player.js"></script>
    <script type="module" src="/static/js/rename-flow.js"></script>
    <script type="module" src="/static/js/tree.js"></script>
    <script type="module" src="/static/js/index/main.js"></script>

</body>

</html>
