<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Video Timestamps</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- BOOTSTRAP CSS (CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="/static/css/timestamps.css">
</head>

<body class="bg-dark text-white">

    <div class="container-fluid p-3">
        <header class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center">
                <h4 class="m-0 me-3" id="videoTitle">Loading...</h4>
                <div class="btn-group" role="group" aria-label="Layout">
                    <button type="button" class="btn btn-sm btn-outline-light" onclick="setLayout(1)">1 Col</button>
                    <button type="button" class="btn btn-sm btn-outline-light" onclick="setLayout(2)">2 Cols</button>
                    <button type="button" class="btn btn-sm btn-outline-light" onclick="setLayout(3)">3 Cols</button>
                </div>
            </div>
            <div>
                <span id="loadingStatus" class="small text-muted me-2"></span>
            </div>
        </header>

        <div id="timestampGrid" class="timestamp-grid cols-3">
            <!-- Cards injected here -->
        </div>
    </div>

    <!-- Hidden video for frame extraction -->
    <div style="display:none; position:absolute; top:-9999px;">
        <video id="sourceVideo" crossorigin="anonymous" muted playsinline></video>
        <canvas id="frameCanvas"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/static/js/timestamps/main.js"></script>
</body>

</html>
